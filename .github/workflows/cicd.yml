name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - uat
      - main

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    # Select AWS Role based on branch
    - name: Set environment variables
      run: |
        if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
          echo "AWS_ROLE=${{ secrets.DEV_AWS_ROLE }}" >> $GITHUB_ENV
          echo "DEPLOYMENT_NAME=flask-app-dev" >> $GITHUB_ENV
        elif [[ "${GITHUB_REF##*/}" == "uat" ]]; then
          echo "AWS_ROLE=${{ secrets.UAT_AWS_ROLE }}" >> $GITHUB_ENV
          echo "DEPLOYMENT_NAME=flask-app-uat" >> $GITHUB_ENV
        else
          echo "AWS_ROLE=${{ secrets.PROD_AWS_ROLE }}" >> $GITHUB_ENV
          echo "DEPLOYMENT_NAME=flask-app-prod" >> $GITHUB_ENV
        fi


    # Configure AWS credentials using OIDC
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ secrets.AWS_REGION }}


    # Login to ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2


    # Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t flask-app .


    # Tag image
    - name: Tag Docker Image
      run: |
        docker tag flask-app:latest \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:${{ github.sha }}


    # Push image to ECR
    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:${{ github.sha }}


    # Update kubeconfig
    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ secrets.AWS_REGION }}


    # Deploy to Kubernetes
    - name: Deploy to EKS
      run: |
        kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
        flask=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:${{ github.sha }}
